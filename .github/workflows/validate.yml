name: Home Assistant and HACS validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Official action wraps a mutable image; pin the actual validator instead.
      - name: Run hassfest
        run: docker run --rm -v "$GITHUB_WORKSPACE:/github/workspace" ghcr.io/home-assistant/hassfest@sha256:d0f082cb684c7560666138e501cdbe36137927acb075e276729728179108651d
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Official HACS action's underlying image, resolved 2026-09-06.
      - uses: docker://ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
        env:
          INPUT_CATEGORY: integration
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_COMMENT: 'false'
          INPUT_IGNORE: ''
