name: Publish development prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: '0.12.8'
      - run: make setup
      - run: npx playwright install --with-deps chromium
      - run: make check
      - name: Verify tag and packaged runtime versions
        env:
          AVIADILO_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/check_release.py dist/aviadilo.zip --tag "$AVIADILO_TAG"
      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          files: dist/aviadilo.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          body: |
            Development candidate: physical tablet acceptance is still pending.

            In HACS, add `bishopdynamics/aviadilo` as a custom repository of type Integration. Open Download/Redownload, expand "Need a different version?", and explicitly select this release. Restart Home Assistant when prompted, then add Aviadilo under Devices & services. The bundled card becomes available automatically in the card picker.
