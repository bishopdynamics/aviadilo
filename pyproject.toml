[project]
name = "aviadilo"
version = "0.1.0.dev1"
description = "Aviadilo integration development scaffolding"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]==4.25.1",
  "pytest==9.0.1",
  "ruff==0.14.7",
  "mypy==1.19.0",
  "types-jsonschema==4.25.1.20251009",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["custom_components/**/*.py", "tests/backend/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/aviadilo", "scripts", "tests/backend"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "scripts"
