[project]
name = "aviadilo"
version = "0.2.0.dev3"
description = "Aviadilo shared aircraft, weather and household map"
license = "MIT"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]==4.25.1",
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "homeassistant==2026.9.1",
  "ruff==0.14.7",
  "mypy==1.19.0",
  "types-jsonschema==4.25.1.20251009",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["custom_components/**/*.py", "tests/backend/**/*.py", "scripts/*.py", "dev/ha/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/aviadilo", "scripts", "tests/backend", "dev/ha"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "scripts"
